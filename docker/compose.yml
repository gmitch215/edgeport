services:
  openssh:
    image: linuxserver/openssh-server:10.3_p1-r0-ls231@sha256:204b64775f7dfb17761ed0644df348ba3cd811628334cc723aa69d61f4db893d
    environment:
      PUID: '1000'
      PGID: '1000'
      USER_NAME: tester
      USER_PASSWORD: testpass
      PASSWORD_ACCESS: 'true'
      SUDO_ACCESS: 'false'
      PUBLIC_KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAnF7atOlMGjLStyDOX18TjMUk5v41Xsl+GrO+Kj2o+9 edgeport-test'
    volumes:
      # provisions password-required sudo for tester (see the script) so sudo tests are real
      - ./openssh-init:/custom-cont-init.d:ro
    ports:
      - '127.0.0.1:2222:2222'

  dropbear:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command:
      - sh
      - -c
      - 'apk add --no-cache dropbear >/dev/null && adduser -D tester && echo "tester:testpass" | chpasswd && exec dropbear -F -E -R -p 2223'
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '2223']
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - '127.0.0.1:2223:2223'

  greenmail:
    image: greenmail/standalone:2.1.12@sha256:9f32971b4f25d32b4de6fa2e297423768441c65e4541f6aecd7631c890a229a7
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=tester:testpass@localhost -Dgreenmail.verbose'
    ports:
      - '127.0.0.1:3025:3025' # smtp
      - '127.0.0.1:3465:3465' # smtps (implicit tls)
      - '127.0.0.1:3143:3143' # imap
      - '127.0.0.1:3993:3993' # imaps (implicit tls)
      - '127.0.0.1:3110:3110' # pop3
      - '127.0.0.1:3995:3995' # pop3s (implicit tls)
      - '127.0.0.1:8080:8080' # rest api (readiness)

  ws-echo:
    image: jmalloc/echo-server:v0.3.7@sha256:c87f80de8dbb976a59b228fc9ecf257e0574c6f760c2f1c5f05f64c7ac7fbc1e
    environment:
      PORT: '8081'
    ports:
      - '127.0.0.1:8081:8081'

  nats:
    image: nats:2.14.5@sha256:026a66a4497c6d7d3eed741781770099c48c755bf3a55b6950d76dd210596eb3
    # -js enables JetStream so recovery.spec can verify durable message continuity
    command:
      ['--user', 'tester', '--pass', 'testpass', '--addr', '0.0.0.0', '-js', '-sd', '/tmp/js']
    ports:
      - '127.0.0.1:4222:4222'

  ftp:
    image: stilliard/pure-ftpd:trixie-1.0.50@sha256:83fdc47e6b912a16aa2bbb30c9f577af64705331acbf7d87ab83aabfa4701089
    environment:
      PUBLICHOST: '127.0.0.1'
      FTP_USER_NAME: 'tester'
      FTP_USER_PASS: 'testpass'
      FTP_USER_HOME: '/home/ftpusers/tester'
      FTP_PASSIVE_PORTS: '40000:40009'
      # the image defaults both to 5; the suite churns a control plus a passive data connection
      # per operation from a single source IP, and past the cap pure-ftpd drops the connection
      # without sending a banner (reads as "connection closed before delimiter was found")
      FTP_MAX_CLIENTS: '64'
      FTP_MAX_CONNECTIONS: '64'
    healthcheck:
      # read the greeting, not just the open port: a server at its client cap still accepts TCP
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/21 && head -c 3 <&3 | grep -q 220']
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - '127.0.0.1:21:21'
      - '127.0.0.1:40000-40009:40000-40009'

  openldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    environment:
      LDAP_ORGANISATION: 'edgeport'
      LDAP_DOMAIN: 'example.org'
      LDAP_ADMIN_PASSWORD: 'admin'
    ports:
      - '127.0.0.1:389:389'
      - '127.0.0.1:636:636'

  ldap-seed:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    depends_on:
      - openldap
    volumes:
      # mount the DIRECTORY (a single-file bind mount clobbers the host file into a dir)
      - ./ldap-bootstrap:/bootstrap:ro
    command:
      - sh
      - -c
      - 'apk add --no-cache openldap-clients >/dev/null && until ldapwhoami -x -H ldap://openldap:389 -D cn=admin,dc=example,dc=org -w admin >/dev/null 2>&1; do sleep 1; done && ldapadd -c -x -H ldap://openldap:389 -D cn=admin,dc=example,dc=org -w admin -f /bootstrap/seed.ldif && echo ldap-seed-complete'
    restart: 'no'

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - '127.0.0.1:1883:1883'

  stomp:
    image: rmohr/activemq:5.15.9@sha256:b5669f141ac5c455b1010b90d348fe78289bba7e2db5659484d99736b696593c
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8161']
      interval: 3s
      timeout: 3s
      retries: 60
    ports:
      - '127.0.0.1:61613:61613'

  syslog:
    image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command:
      - sh
      - -c
      - 'apk add --no-cache socat >/dev/null && : > /tmp/syslog.log && (socat -u TCP-LISTEN:5514,fork,reuseaddr OPEN:/tmp/syslog.log,append &) && exec socat TCP-LISTEN:5515,fork,reuseaddr SYSTEM:"cat /tmp/syslog.log"'
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '5515']
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - '127.0.0.1:5514:5514' # ingest
      - '127.0.0.1:5515:5515' # readback

  smscsim:
    image: ukarim/smscsim:latest@sha256:673ef3b2c62e3aa34be0528a9034b53e04c4fc2fbf4e65e03225717de8890707
    ports:
      - '127.0.0.1:2775:2775' # smpp
      - '127.0.0.1:12775:12775' # http MO injection

  sip:
    image: debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
    entrypoint: ['/bin/sh', '/entrypoint.sh']
    volumes:
      - ./sip/kamailio.cfg:/sip/kamailio.cfg:ro
      - ./sip/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/5060']
      interval: 3s
      timeout: 3s
      retries: 60
    ports:
      - '127.0.0.1:5060:5060/tcp' # sip over tcp (the workers transport)
      - '127.0.0.1:2855:2855/tcp' # msrp relay

  dns:
    image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    command: ['-conf', '/Corefile']
    volumes:
      - ./dns/Corefile:/Corefile:ro
      - ./dns/db.edgeport.test:/zones/db.edgeport.test:ro
      - ./dns/db.10.0.1:/zones/db.10.0.1:ro
    ports:
      - '127.0.0.1:5354:53/tcp' # dns over tcp (the workers transport)
      - '127.0.0.1:5354:53/udp'

  xmpp:
    image: ghcr.io/processone/ejabberd:26.07@sha256:5aeb0faa39cfe38792c5eea9cc6344ba9ab6c59c708a24e897d6b471882c8497
    # ejabberd's BEAM VM can crash-exit (code 1) during the full-stack startup crunch; let docker
    # restart it so a transient boot flake self-recovers instead of failing `up --wait` (CI #130)
    restart: on-failure
    environment:
      CTL_ON_CREATE: 'register tester localhost testpass ; register tester2 localhost testpass'
    volumes:
      - ./xmpp/ejabberd.yml:/opt/ejabberd/conf/ejabberd.yml:ro
    healthcheck:
      test: ['CMD-SHELL', 'ejabberdctl registered_users localhost | grep -qx tester2 || exit 1']
      interval: 3s
      timeout: 5s
      retries: 40
    ports:
      - '127.0.0.1:5222:5222' # xmpp c2s (plaintext)

  redis:
    image: redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff
    # requirepass covers the default user (AUTH <pass>); the ACL user covers AUTH <user> <pass>
    command:
      [
        'redis-server',
        '--requirepass',
        'testpass',
        '--user',
        'tester',
        'on',
        '>testpass',
        '~*',
        '&*',
        '+@all'
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'testpass', '--no-auth-warning', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - '127.0.0.1:6379:6379'

  irc:
    image: ghcr.io/ergochat/ergo:stable@sha256:72db5b93b437ea0512fb79d9d4d035f0916ccba07ed736dec19e8d5b5a73f972
    volumes:
      - ./irc/ircd.yaml:/ircd/ircd.yaml:ro
    healthcheck:
      test: ['CMD', 'sh', '-c', 'nc -z 127.0.0.1 6667']
      interval: 2s
      timeout: 2s
      retries: 40
    ports:
      - '127.0.0.1:6667:6667' # irc (plaintext)
